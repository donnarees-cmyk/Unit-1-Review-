        "prompt": "For each description, choose the reading skill it describes.",
        "options": [
          "Summary",
          "Paraphrase"
        ],
        "answer": [
          0,
          1,
          0
        ],
        "explain": "A summary condenses the main points of a whole text. A paraphrase restates a particular passage while preserving its important meaning and detail.",
        "hint": "Ask whether the task condenses the whole text or restates a specific portion.",
        "rows": [
          "Briefly states Text 1’s problem, main action, and outcome",
          "Restates one sentence from Text 2 in new wording",
          "Leaves out minor details to give the whole narrative’s main points"
        ]
      }
    ]
  }
];
const KEY='unit1-reading-challenge-v1';
let state={name:'',results:{}};try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.results==='object')state=s}catch(e){}
let current=0,index=0,choice=[],message='',status='';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(l,i)=>l+'-'+i;
const result=(l,i)=>state.results[key(l,i)];
const done=l=>LEVELS[l].questions.every((_,i)=>result(l,i)?.passed);
const total=()=>Object.values(state.results).filter(r=>r.passed).length;
const points=()=>Object.values(state.results).reduce((s,r)=>s+(r.points||0),0);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
function showMap(){app.innerHTML=`<section class="card"><h2>Your mission</h2><p>Read closely, interpret the author’s choices, and support your thinking with evidence. Complete six levels using single-select, multiselect, selectable hot text, matching tables, and a two-part evidence question.</p><label>Student name <input type="text" id="name" value="${esc(state.name)}" placeholder="Enter your name" oninput="state.name=this.value;save()"></label><div class="stats"><p><b>${total()} / 24</b> questions mastered</p><p><b>${points()} / 240</b> points</p><p><b>${LEVELS.filter((_,l)=>done(l)).length} / 6</b> badges</p></div><progress max="24" value="${total()}" aria-label="Questions mastered"></progress><p class="muted">Play in order: read the passage, answer each question, use feedback to revise, and finish the level before moving on. Earn 10 points for a correct first try or 5 after a retry. You can revisit completed questions.</p></section><section class="grid">${LEVELS.map((l,n)=>{let unlocked=n===0||done(n-1);return `<div class="level"><span class="tag">LEVEL ${n+1} ${done(n)?'• BADGE EARNED':''}</span><h3>${esc(l.title)}</h3><p class="muted">${esc(l.genre)}</p><p>${l.questions.filter((_,i)=>result(n,i)?.passed).length} / 4 mastered</p><button ${unlocked?'':'disabled'} onclick="openLevel(${n})">${done(n)?'Revisit level':unlocked?'Enter level':'Finish the previous level'}</button></div>`}).join('')}</section><section class="card"><h2>Your student report</h2><p>Download your progress at any time. After all six levels, your report includes the six badges, your first-try accuracy, points, and practice attempts.</p><button class="primary" onclick="downloadReport()">Download student report</button><button onclick="resetGame()">Start a new student session</button><div id="reset"></div></section>`;}
function openLevel(l){current=l;index=0;loadQuestion()}
function loadQuestion(){let r=result(current,index);choice=r?.choice?.slice()||[];message=r?.passed?'You mastered this question. Continue when ready.':'';status=r?.passed?'good':'';render()}
function select(n){let q=LEVELS[current].questions[index];if(result(current,index)?.passed)return;if(q.answer.length>1&&q.type!=='match'){choice=choice.includes(n)?choice.filter(x=>x!==n):[...choice,n]}else{choice=[n]}message='';status='';render()}
function selectRow(row,n){if(result(current,index)?.passed)return;choice[row]=n;message='';status='';render()}
function valid(q,c){return q.type==='match'?q.rows.every((_,i)=>Number.isInteger(c[i])):c.length===q.answer.length}
function same(q,c){if(!valid(q,c))return false;return q.type==='match'?q.answer.every((v,i)=>c[i]===v):[...c].sort((a,b)=>a-b).join(',')===[...q.answer].sort((a,b)=>a-b).join(',')}
function grade(){let q=LEVELS[current].questions[index],id=key(current,index),r=state.results[id];if(r?.passed)return;if(!valid(q,choice)){message=q.type==='match'?'Choose one response for every row.':`Select exactly ${q.answer.length} ${q.answer.length===1?'response':'responses'} before checking.`;status='retry';render();return}let correct=same(q,choice);if(!r)r=state.results[id]={attempts:0,firstCorrect:correct,firstChoice:choice.slice(),points:0};r.attempts++;r.choice=choice.slice();r.passed=correct;if(correct){r.points=r.attempts===1?10:5;message='Correct! '+q.explain;status='good'}else{message='Try again. '+q.hint;status='retry'}save();render()}
function render(){let l=LEVELS[current],q=l.questions[index],passed=result(current,index)?.passed;let type={mc:'Single-select',multi:'Multiselect',hot:'Selectable hot text',match:'Matching table'}[q.type];let opts=q.type==='match'?`<div class="tablewrap"><table><thead><tr><th scope="col">Statement</th>${q.options.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${q.rows.map((row,r)=>`<tr><th scope="row">${esc(row)}</th>${q.options.map((opt,n)=>`<td><label><input aria-label="${esc(row+' — '+opt)}" type="radio" name="row${r}" ${choice[r]===n?'checked':''} ${passed?'disabled':''} onchange="selectRow(${r},${n})"></label></td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="options">${q.options.map((s,n)=>`<button class="option ${q.type==='hot'?'hot':''} ${choice.includes(n)?'selected':''}" aria-pressed="${choice.includes(n)}" ${passed?'disabled':''} onclick="select(${n})">${q.type==='hot'?'':String.fromCharCode(65+n)+'. '}${esc(s)}</button>`).join('')}</div>`;
app.innerHTML=`<div class="top"><span class="tag">LEVEL ${current+1} • QUESTION ${index+1} OF 4</span><span>${points()} points • ${total()}/24 mastered</span></div><div class="workspace"><article class="panel passage"><p class="muted">${esc(l.genre)}</p><h2>${esc(l.title)}</h2>${l.parts.map((p,n)=>`<p><span class="num">[${n+1}]</span>${p}</p>`).join('')}</article><section class="panel right"><span class="tag">${type}${q.pair?' • TWO-PART EVIDENCE QUESTION':''}</span><h2>${esc(q.skill)}</h2><p class="muted">${esc(q.code)}</p><h3>${esc(q.prompt)}</h3>${q.type==='hot'?'<p class="muted">Select the passage excerpt or excerpts below. Tap again to remove a selection.</p>':''}${q.pair?'<p class="muted">Part A asks for an interpretation. Part B asks for the evidence supporting it.</p>':''}${opts}<button class="primary" onclick="grade()" ${passed?'disabled':''}>Check response</button><div aria-live="polite" aria-atomic="true">${message?`<div class="feedback ${status}">${esc(message)}</div>`:''}</div><details><summary>Need a strategy?</summary><p>${esc(q.hint)}</p></details><div class="actions"><button onclick="previous()" ${index===0?'disabled':''}>Previous</button><button class="primary" onclick="next()" ${passed?'':'disabled'}>${index===3?'Finish level':'Next question'}</button></div></section></div>`;}
function previous(){if(index>0){index--;loadQuestion()}}
function next(){if(!result(current,index)?.passed)return;if(index<3){index++;loadQuestion()}else{app.innerHTML=`<section class="card"><span class="tag">BADGE EARNED</span><h2>Level ${current+1} mastered!</h2><p>You completed ${esc(LEVELS[current].title)}. ${total()===24?'All six badges are yours! Download your report to share your work.':'Keep building your reading skills in the next level.'}</p><div class="actions">${current<5?`<button class="primary" onclick="openLevel(${current+1})">Play next level</button>`:'<button class="primary" onclick="downloadReport()">Download completion report</button>'}<button onclick="showMap()">Return to map</button></div></section>`}}
function resetGame(){document.getElementById('reset').innerHTML='<div class="feedback retry">Starting a new session clears this browser’s current progress. Download your report first if you need it. <div class="actions"><button onclick="confirmReset()">Clear progress and start</button><button onclick="showMap()">Keep current session</button></div></div>'}
function confirmReset(){state={name:'',results:{}};save();showMap()}
function answerText(q,c){if(!c)return 'Not attempted';if(q.type==='match')return q.rows.map((row,r)=>row+': '+(q.options[c[r]]||'No choice')).join(' | ');return c.map(n=>q.options[n]).join(' | ')}
function reportText(){let rs=Object.values(state.results),first=rs.filter(r=>r.firstCorrect).length;let out=['UNIT 1 READING CHALLENGE — STUDENT REPORT','Student: '+(state.name||'Name not entered'),'Date: '+new Date().toLocaleString(),'Status: '+(total()===24?'Complete':'In progress'),'Questions mastered: '+total()+'/24','First-try accuracy: '+first+'/'+rs.length+' attempted questions','Points: '+points()+'/240','Badges: '+LEVELS.filter((_,l)=>done(l)).length+'/6',''];LEVELS.forEach((l,n)=>{out.push('LEVEL '+(n+1)+': '+l.title+' — '+(done(n)?'Badge earned':'In progress'));l.questions.forEach((q,i)=>{let r=result(n,i);out.push('  '+(i+1)+'. '+q.skill+' ('+q.code+')','     '+q.prompt,'     First response: '+answerText(q,r?.firstChoice),'     Current response: '+answerText(q,r?.choice),'     '+(r?`Attempts: ${r.attempts} | First try: ${r.firstCorrect?'Correct':'Needs practice'} | ${r.passed?'Mastered':'Not yet mastered'} | Points: ${r.points}`:'Not attempted'))});out.push('')});out.push('Classroom practice report. Points are game rewards, not an official assessment score.');return out.join('\n')}
function downloadReport(){const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Unit-1-Reading-Report-'+(state.name||'Student').replace(/[^a-z0-9_-]/gi,'-')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
showMap();
</script></body></html>
